spring.application.name=rutas-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${RUTAS_DB_PATH:./data/rutas};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
routing.base-url=${ROUTING_BASE_URL:https://valhalla1.openstreetmap.de}
routing.timeout-seconds=25
